  <text x="180" y="560" font-size="16" font-family="monospace" font-weight="bold" fill="#0f172a">V<tspan font-size="12" dy="3">1</tspan><tspan dy="-3"> := V</tspan><tspan font-size="12" dy="3">max</tspan></text>

  <text x="40" y="590" font-size="16" font-family="monospace" font-weight="bold" fill="#0f172a">P<tspan font-size="12" dy="3">2</tspan><tspan dy="-3"> := P</tspan><tspan font-size="12" dy="3">aval</tspan></text>
  <text x="180" y="590" font-size="16" font-family="monospace" font-weight="bold" fill="#0f172a">V<tspan font-size="12" dy="3">2</tspan><tspan dy="-3"> := V</tspan><tspan font-size="12" dy="3">min</tspan></text>

  <path d="M 310 545 Q 318 545 318 565 Q 318 575 325 575 Q 318 575 318 585 Q 318 605 310 605" fill="none" stroke="#0f172a" stroke-width="2" />
  <text x="335" y="580" font-size="16" font-style="italic" font-weight="bold" fill="#0f172a">constantes renommées</text> -->
</svg>
