<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 600 480" width="100%" height="100%" style="background-color: #ffffff; font-family: Ubuntu, sans-serif;">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#0f172a" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#1e40af" />
    </marker>

    <pattern id="hatch-net" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#475569" stroke-width="1.5" />
    </pattern>

    <pattern id="hatch-recu" width="12" height="12" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2" />
    </pattern>
  </defs>

  <line x1="100" y1="400" x2="100" y2="50" stroke="#0f172a" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="95" y="42" font-size="20" font-weight="bold" font-style="italic" fill="#0f172a" text-anchor="middle">P</text>

  <line x1="100" y1="400" x2="560" y2="400" stroke="#0f172a" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="500" y="425" font-size="18" font-weight="bold" font-style="italic" fill="#0f172a">V<tspan font-size="13" dy="4">cyl</tspan></text>
  <text x="480" y="445" font-size="13" font-style="italic" fill="#475569">(au-dessus du piston)</text>

  <line x1="93" y1="130" x2="100" y2="130" stroke="#0f172a" stroke-width="2" />
  <text x="85" y="135" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">P<tspan font-size="12" dy="3">aval</tspan></text>

  <line x1="93" y1="270" x2="100" y2="270" stroke="#0f172a" stroke-width="2" />
  <text x="85" y="275" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">P<tspan font-size="12" dy="3">amont</tspan></text>

  <line x1="260" y1="400" x2="260" y2="407" stroke="#0f172a" stroke-width="2" />
  <text x="260" y="428" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">V<tspan font-size="12" dy="3">min</tspan></text>
  <line x1="260" y1="400" x2="260" y2="130" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <line x1="450" y1="400" x2="450" y2="407" stroke="#0f172a" stroke-width="2" />
  <text x="450" y="428" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">V<tspan font-size="12" dy="3">max</tspan></text>
  <line x1="450" y1="400" x2="450" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <rect x="100" y="270" width="350" height="130" fill="url(#hatch-recu)" />

  <path d="M 100 270 L 450 270 C 370 260 290 210 260 130 L 100 130 Z" fill="url(#hatch-net)" opacity="0.85" />

  <line x1="100" y1="270" x2="450" y2="270" stroke="#1e40af" stroke-width="2.5" />
  <line x1="240" y1="270" x2="260" y2="270" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arrowhead-blue)" />

  <path d="M 450 270 C 370 260 290 210 260 130" fill="none" stroke="#1e40af" stroke-width="2.5" />
  <path d="M 370 248 L 350 236" fill="none" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arrowhead-blue)" />

  <line x1="260" y1="130" x2="100" y2="130" stroke="#1e40af" stroke-width="2.5" />
  <line x1="180" y1="130" x2="160" y2="130" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arrowhead-blue)" />

  <line x1="100" y1="130" x2="100" y2="270" stroke="#1e40af" stroke-width="2.5" />
  <line x1="100" y1="190" x2="100" y2="210" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arrowhead-blue)" />

  <g stroke="#b91c1c" stroke-width="2.5">
    <line x1="444" y1="264" x2="456" y2="276" />
    <line x1="444" y1="276" x2="456" y2="264" />
  </g>

  <g stroke="#b91c1c" stroke-width="2.5">
    <line x1="254" y1="124" x2="266" y2="136" />
    <line x1="254" y1="136" x2="266" y2="124" />
  </g>

  <text x="210" y="295" font-size="15" font-weight="bold" fill="#0f172a">entrée de fluide</text>
  <text x="340" y="292" font-size="14" font-weight="bold" fill="#0f172a">n ↗</text>

  <text x="140" y="118" font-size="15" font-weight="bold" fill="#0f172a">sortie de fluide</text>
  <text x="245" y="118" font-size="14" font-weight="bold" fill="#0f172a">n ↘</text>

  <path d="M 350 150 Q 360 190 230 180" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="300" y="140" font-size="16" font-weight="bold" fill="#0f172a">travail cédé par le piston,</text>
  <text x="360" y="160" font-size="16" font-weight="bold" fill="#0f172a">dit « net », τ</text>

  <path d="M 150 430 Q 150 410 200 340" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="120" y="450" font-size="16" font-weight="bold" fill="#0f172a">travail reçu par</text>
  <text x="120" y="470" font-size="16" font-weight="bold" fill="#0f172a">le piston</text>

  <!-- <text x="300" y="480" font-size="28" font-weight="bold" fill="#0f172a">Watt</text> -->
